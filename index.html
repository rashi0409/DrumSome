<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>DrumSome</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Arvo|Lobster" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <header>
    <h1 id="title">
      <i class="fas fa-drum"></i> Play the Drum <i class="fas fa-drum"></i>
    </h1>
  </header>
  <main class="container">
    <div class="set">
      <button class="w drum">w</button>
      <button class="a drum">a</button>
      <button class="s drum">s</button>
      <button class="d drum">d</button>
      <button class="j drum">j</button>
      <button class="k drum">k</button>
      <button class="l drum">l</button>
    </div>
    
   

  
    <div class="volume">
      <p>
        <button id="muteButton">
          <i id="muteIcon" class="fas fa-volume-up"></i>
        </button>
        <button id="themeToggle"><i class="fas fa-moon"></i> Dark Mode</button>
      </p>
      <p>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      </p>
    </div>
  
    <div class="controls">
      <button id="recordButton">Start Recording</button>
      <button id="playbackButton">Play Recording</button>

      <button id="bgMusicToggle">Play Background Music</button>

    </div>
  </main>

  <footer>
    <p>© 2024 Drum Kit | <i class="music-icon fas fa-music"></i></p>
  </footer>
  

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="index.js" charset="utf-8"></script>
</body>

</html>
